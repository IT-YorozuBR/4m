<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciar Usuários — 4M Sistema</title>
  <link rel="icon" href="./4m-logo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel: #141414;
      --panel-soft: #1b1b1b;
      --line: rgba(255, 255, 255, .1);
      --text: #fff;
      --muted: rgba(255, 255, 255, .7);
      --muted-soft: rgba(255, 255, 255, .5);
      --accent: #ffd600;
      --accent-soft: rgba(255, 214, 0, .14);
      --danger: #ff9d97;
      --danger-soft: rgba(244, 67, 54, .16);
      --ok: #7ee0a1;
      --shadow: 0 18px 50px rgba(0, 0, 0, .34)
    }

    * { box-sizing: border-box; margin: 0; padding: 0 }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top, rgba(255, 214, 0, .08), transparent 24%), linear-gradient(180deg, #0a0a0a, #000 42%);
      color: var(--text);
      min-height: 100vh;
    }

    .navbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 16px 24px;
      background: rgba(8, 8, 8, .92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }
    .navbar-title { font-size: 1.25rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px }
    .navbar-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }

    .btn, .chip, a.btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(255, 255, 255, .05); color: var(--text); text-decoration: none;
      font: inherit; cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, .2) }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none }
    .btn-accent { background: linear-gradient(135deg, rgba(255, 214, 0, .2), rgba(255, 214, 0, .08)); color: var(--accent); border-color: rgba(255, 214, 0, .3) }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(244, 67, 54, .26) }
    .btn-sm { padding: 8px 11px; border-radius: 10px; font-size: .85rem }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 60px }

    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 22px; box-shadow: var(--shadow); margin-bottom: 24px;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px }
    .card h2 .material-icons { color: var(--accent) }

    .grid-form { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end }
    @media (max-width: 760px) { .grid-form { grid-template-columns: 1fr } }

    .field { display: flex; flex-direction: column; gap: 6px }
    .field label { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em }
    input, select {
      padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--panel-soft); color: var(--text); font: inherit; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent) }
    select option { background: #1b1b1b }

    .user-row {
      display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 14px; align-items: center;
      padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-soft);
      margin-bottom: 10px;
    }
    @media (max-width: 760px) { .user-row { grid-template-columns: 1fr } }

    .user-name { font-weight: 600; display: flex; align-items: center; gap: 8px }
    .user-name .material-icons { color: var(--muted-soft) }
    .user-meta { font-size: .76rem; color: var(--muted-soft); margin-top: 3px }

    .badge {
      font-size: .72rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--muted); white-space: nowrap;
    }
    .badge.admin { color: var(--accent); border-color: rgba(255, 214, 0, .35); background: var(--accent-soft) }
    .badge.master { color: #ffd6f0; border-color: rgba(233, 30, 99, .4); background: rgba(233, 30, 99, .14) }

    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: flex-end }
    .row-actions select, .row-actions input { min-width: 150px }

    .muted { color: var(--muted-soft); font-size: .85rem }
    .empty { text-align: center; color: var(--muted-soft); padding: 26px }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #141414; border: 1px solid var(--line); color: var(--text);
      padding: 12px 18px; border-radius: 12px; box-shadow: var(--shadow); z-index: 50; max-width: 90%;
    }
    .toast.ok { border-color: rgba(126, 224, 161, .4); color: var(--ok) }
    .toast.err { border-color: rgba(244, 67, 54, .4); color: var(--danger) }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="navbar-title"><span class="material-icons">manage_accounts</span> Gerenciar Usuários</div>
    <div class="navbar-right">
      <a class="btn" href="/4m.html"><span class="material-icons">arrow_back</span>Voltar</a>
      <button class="btn btn-danger" type="button" onclick="logout()"><span class="material-icons">logout</span>Sair</button>
    </div>
  </nav>

  <div class="wrap">
    <div class="card">
      <h2><span class="material-icons">person_add</span> Novo usuário</h2>
      <form id="formNovo" class="grid-form" autocomplete="off">
        <div class="field">
          <label for="novoUsername">Usuário</label>
          <input id="novoUsername" name="username" placeholder="ex.: maria.silva" autocomplete="off" />
        </div>
        <div class="field">
          <label for="novoPassword">Senha</label>
          <input id="novoPassword" name="password" type="password" placeholder="mín. 6 caracteres" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="novoRole">Perfil</label>
          <select id="novoRole" name="role"></select>
        </div>
        <button class="btn btn-accent" type="submit"><span class="material-icons">add</span>Criar</button>
      </form>
    </div>

    <div class="card">
      <h2><span class="material-icons">group</span> Usuários cadastrados</h2>
      <div id="lista"><div class="empty">Carregando…</div></div>
    </div>
  </div>

  <script src="/scripts/api-config.js"></script>
  <script>
    const API_URL = window.APP_CONFIG?.API_URL || '/api';
    const MASTER = 'admin.ti';

    // Produção (operador) não tem conta — apenas perfis com login aparecem aqui.
    const ROLES = [
      { value: 'qualidade', label: 'Qualidade' },
      { value: 'aprovador_qualidade', label: 'Aprovação Qualidade' },
      { value: 'admin', label: 'Administrador' },
    ];
    const ROLE_LABEL = Object.fromEntries(ROLES.map(r => [r.value, r.label]));
    // Rótulo de exibição para qualquer conta legada com role 'operador'.
    ROLE_LABEL.operador = 'Operador (sem conta)';

    const getUser = () => { try { return JSON.parse(localStorage.getItem('currentUser') || '{}') } catch { return {} } };
    const getToken = () => { const t = localStorage.getItem('authToken'); return t && t !== 'null' && t !== 'undefined' ? t : null };
    const isAdmin = () => getUser().role === 'admin' && !!getToken();
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    function toast(msg, tipo = '') {
      const old = document.querySelector('.toast'); if (old) old.remove();
      const el = document.createElement('div');
      el.className = 'toast ' + tipo;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function logout() {
      if (!confirm('Deseja realmente sair do sistema?')) return;
      localStorage.removeItem('currentUser');
      localStorage.removeItem('authToken');
      location.href = '/login.html';
    }

    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` };
    }

    function roleOptions(selected) {
      return ROLES.map(r => `<option value="${r.value}" ${r.value === selected ? 'selected' : ''}>${r.label}</option>`).join('');
    }

    async function carregar() {
      const lista = document.getElementById('lista');
      try {
        const r = await fetch(`${API_URL}/admin/users`, { headers: authHeaders() });
        const data = await r.json();
        if (!r.ok || !data.success) throw new Error(data.message || 'Falha ao carregar usuários');

        const eu = getUser().username;
        const souMaster = eu === MASTER;

        if (!data.users.length) { lista.innerHTML = '<div class="empty">Nenhum usuário cadastrado.</div>'; return; }

        lista.innerHTML = data.users.map(u => {
          const ehMaster = u.username === MASTER;
          const ehEu = u.username === eu;
          const badge = ehMaster
            ? '<span class="badge master">Admin master</span>'
            : `<span class="badge ${u.role === 'admin' ? 'admin' : ''}">${esc(ROLE_LABEL[u.role] || u.role || 'operador')}</span>`;

          // Não permite alterar o perfil do master, nem o próprio perfil (evita lockout)
          const roleTravado = ehMaster || ehEu;
          // Senha do master só o próprio master troca
          const senhaTravada = ehMaster && !souMaster;

          return `
          <div class="user-row" data-username="${esc(u.username)}">
            <div>
              <div class="user-name"><span class="material-icons">account_circle</span>${esc(u.username)}${ehEu ? ' <span class="muted">(você)</span>' : ''}</div>
              <div class="user-meta">${badge}${u.created_by ? ' · criado por ' + esc(u.created_by) : ''}</div>
            </div>
            <div class="field">
              <label>Perfil</label>
              <select class="sel-role" ${roleTravado ? 'disabled' : ''}>${roleOptions(u.role || 'qualidade')}</select>
            </div>
            <div class="row-actions">
              <button class="btn btn-sm btn-accent act-role" ${roleTravado ? 'disabled' : ''}><span class="material-icons">save</span>Salvar perfil</button>
              <input class="inp-senha" type="password" placeholder="nova senha" autocomplete="new-password" ${senhaTravada ? 'disabled' : ''} />
              <button class="btn btn-sm act-senha" ${senhaTravada ? 'disabled' : ''}><span class="material-icons">key</span>Trocar senha</button>
            </div>
          </div>`;
        }).join('');

        // Liga os eventos
        lista.querySelectorAll('.user-row').forEach(row => {
          const username = row.dataset.username;
          row.querySelector('.act-role')?.addEventListener('click', () => salvarRole(username, row));
          row.querySelector('.act-senha')?.addEventListener('click', () => trocarSenha(username, row));
        });
      } catch (e) {
        lista.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }

    async function atualizar(username, body, okMsg) {
      const r = await fetch(`${API_URL}/admin/users/${encodeURIComponent(username)}`, {
        method: 'PUT', headers: authHeaders(), body: JSON.stringify(body)
      });
      const data = await r.json();
      if (!r.ok || !data.success) throw new Error(data.message || 'Falha ao atualizar');
      toast(okMsg, 'ok');
      return data;
    }

    async function salvarRole(username, row) {
      const role = row.querySelector('.sel-role').value;
      try {
        await atualizar(username, { role }, `Perfil de ${username} atualizado.`);
        carregar();
      } catch (e) { toast(e.message, 'err'); }
    }

    async function trocarSenha(username, row) {
      const inp = row.querySelector('.inp-senha');
      const senha = (inp.value || '').trim();
      if (senha.length < 6) { toast('A nova senha deve ter pelo menos 6 caracteres.', 'err'); inp.focus(); return; }
      try {
        await atualizar(username, { password: senha }, `Senha de ${username} trocada.`);
        inp.value = '';
      } catch (e) { toast(e.message, 'err'); }
    }

    document.getElementById('formNovo').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const username = document.getElementById('novoUsername').value.trim();
      const password = document.getElementById('novoPassword').value;
      const role = document.getElementById('novoRole').value;
      if (!username) { toast('Informe o usuário.', 'err'); return; }
      if ((password || '').length < 6) { toast('A senha deve ter pelo menos 6 caracteres.', 'err'); return; }
      try {
        const r = await fetch(`${API_URL}/admin/users`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ username, password, role }) });
        const data = await r.json();
        if (!r.ok || !data.success) throw new Error(data.message || 'Falha ao criar usuário');
        toast(`Usuário ${username} criado.`, 'ok');
        ev.target.reset();
        document.getElementById('novoRole').value = 'qualidade';
        carregar();
      } catch (e) { toast(e.message, 'err'); }
    });

    // Guarda de acesso + boot
    (function init() {
      if (!isAdmin()) {
        // Logado mas sem ser admin → volta ao painel; sem login → tela de login.
        location.href = getToken() ? '/4m.html' : '/login.html';
        return;
      }
      document.getElementById('novoRole').innerHTML = roleOptions('qualidade');
      carregar();
    })();
  </script>
</body>

</html>
