<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs de Auditoria — 4M Sistema</title>
  <link rel="icon" href="./4m-logo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel: #141414;
      --panel-soft: #1b1b1b;
      --line: rgba(255, 255, 255, .1);
      --text: #fff;
      --muted: rgba(255, 255, 255, .7);
      --muted-soft: rgba(255, 255, 255, .5);
      --accent: #ffd600;
      --accent-soft: rgba(255, 214, 0, .14);
      --danger: #ff9d97;
      --danger-soft: rgba(244, 67, 54, .16);
      --ok: #7ee0a1;
      --ok-soft: rgba(126, 224, 161, .14);
      --info: #8ec5ff;
      --shadow: 0 18px 50px rgba(0, 0, 0, .34)
    }

    * { box-sizing: border-box; margin: 0; padding: 0 }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top, rgba(255, 214, 0, .08), transparent 24%), linear-gradient(180deg, #0a0a0a, #000 42%);
      color: var(--text);
      min-height: 100vh;
    }

    .navbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 16px 24px;
      background: rgba(8, 8, 8, .92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }
    .navbar-title { font-size: 1.25rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px }
    .navbar-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }

    .btn, .chip, a.btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(255, 255, 255, .05); color: var(--text); text-decoration: none;
      font: inherit; cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, .2) }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none }
    .btn-accent { background: linear-gradient(135deg, rgba(255, 214, 0, .2), rgba(255, 214, 0, .08)); color: var(--accent); border-color: rgba(255, 214, 0, .3) }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: rgba(244, 67, 54, .26) }
    .btn-sm { padding: 8px 11px; border-radius: 10px; font-size: .85rem }

    .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 20px 60px }

    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 22px; box-shadow: var(--shadow); margin-bottom: 24px;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px }
    .card h2 .material-icons { color: var(--accent) }

    .filtros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: end }
    .filtros .acoes-filtro { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end }
    @media (max-width: 1000px) { .filtros { grid-template-columns: repeat(2, 1fr) } }
    @media (max-width: 620px) { .filtros { grid-template-columns: 1fr } }

    .field { display: flex; flex-direction: column; gap: 6px }
    .field label { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em }
    input, select {
      padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--panel-soft); color: var(--text); font: inherit; outline: none; width: 100%;
    }
    input:focus, select:focus { border-color: var(--accent) }
    select option { background: #1b1b1b }

    .tabela-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px }
    table { width: 100%; border-collapse: collapse; min-width: 980px }
    thead th {
      text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); padding: 12px 14px; background: var(--panel-soft);
      border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    tbody td { padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, .06); font-size: .88rem; vertical-align: top }
    tbody tr.linha-log { cursor: pointer; transition: background .15s ease }
    tbody tr.linha-log:hover { background: rgba(255, 255, 255, .035) }
    tbody tr:last-child td { border-bottom: none }

    .quando { white-space: nowrap; font-variant-numeric: tabular-nums }
    .quando small { display: block; color: var(--muted-soft); font-size: .72rem }
    .usuario { font-weight: 600; display: flex; align-items: center; gap: 6px }
    .usuario .material-icons { font-size: 18px; color: var(--muted-soft) }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: .82rem }

    .badge {
      display: inline-block; font-size: .72rem; padding: 3px 9px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
    }
    .badge.cat-checklist { color: var(--accent); border-color: rgba(255, 214, 0, .35); background: var(--accent-soft) }
    .badge.cat-usuario { color: #ffd6f0; border-color: rgba(233, 30, 99, .4); background: rgba(233, 30, 99, .14) }
    .badge.cat-autenticacao { color: var(--info); border-color: rgba(142, 197, 255, .35); background: rgba(142, 197, 255, .12) }
    .badge.cat-dashboard { color: #c6a7ff; border-color: rgba(171, 130, 255, .35); background: rgba(171, 130, 255, .12) }
    .badge.res-sucesso { color: var(--ok); border-color: rgba(126, 224, 161, .38); background: var(--ok-soft) }
    .badge.res-negado { color: var(--danger); border-color: rgba(244, 67, 54, .38); background: var(--danger-soft) }
    .badge.res-falha { color: #ffc48a; border-color: rgba(255, 152, 0, .38); background: rgba(255, 152, 0, .14) }

    .detalhes td { background: rgba(255, 255, 255, .025); padding: 0 14px 16px }
    .diff { width: 100%; border-collapse: collapse; min-width: 0; margin-top: 6px }
    .diff th, .diff td { padding: 7px 10px; font-size: .8rem; border-bottom: 1px solid rgba(255, 255, 255, .06) }
    .diff th { color: var(--muted-soft); text-transform: none; letter-spacing: 0; background: transparent }
    .diff .de { color: var(--danger) }
    .diff .para { color: var(--ok) }
    .meta-linha { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted-soft); font-size: .78rem; padding-top: 12px }

    .paginacao { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap }
    .muted { color: var(--muted-soft); font-size: .85rem }
    .empty { text-align: center; color: var(--muted-soft); padding: 32px }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #141414; border: 1px solid var(--line); color: var(--text);
      padding: 12px 18px; border-radius: 12px; box-shadow: var(--shadow); z-index: 50; max-width: 90%;
    }
    .toast.ok { border-color: rgba(126, 224, 161, .4); color: var(--ok) }
    .toast.err { border-color: rgba(244, 67, 54, .4); color: var(--danger) }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="navbar-title"><span class="material-icons">history</span> Logs de Auditoria</div>
    <div class="navbar-right">
      <a class="btn" href="/usuarios.html"><span class="material-icons">manage_accounts</span>Usuários</a>
      <a class="btn" href="/4m.html"><span class="material-icons">arrow_back</span>Voltar</a>
      <button class="btn btn-danger" type="button" onclick="logout()"><span class="material-icons">logout</span>Sair</button>
    </div>
  </nav>

  <div class="wrap">
    <div class="card">
      <h2><span class="material-icons">filter_alt</span> Filtros</h2>
      <form id="formFiltros" class="filtros" autocomplete="off">
        <div class="field">
          <label for="fUsuario">Usuário</label>
          <select id="fUsuario"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="fCategoria">Área</label>
          <select id="fCategoria"><option value="">Todas</option></select>
        </div>
        <div class="field">
          <label for="fAcao">Ação</label>
          <select id="fAcao"><option value="">Todas</option></select>
        </div>
        <div class="field">
          <label for="fResultado">Resultado</label>
          <select id="fResultado">
            <option value="">Todos</option>
            <option value="sucesso">Sucesso</option>
            <option value="negado">Negado</option>
            <option value="falha">Falha</option>
          </select>
        </div>
        <div class="field">
          <label for="fDataInicio">De</label>
          <input id="fDataInicio" type="date" />
        </div>
        <div class="field">
          <label for="fDataFim">Até</label>
          <input id="fDataFim" type="date" />
        </div>
        <div class="field">
          <label for="fBusca">Buscar (nº de controle, descrição, IP)</label>
          <input id="fBusca" placeholder="ex.: FR0062-000000012" />
        </div>
        <div class="field">
          <label for="fLimite">Por página</label>
          <select id="fLimite">
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>
        <div class="acoes-filtro">
          <button class="btn btn-sm" type="button" onclick="limparFiltros()"><span class="material-icons">restart_alt</span>Limpar</button>
          <button class="btn btn-sm" type="button" onclick="exportarCSV()"><span class="material-icons">download</span>Exportar CSV</button>
          <button class="btn btn-sm btn-accent" type="submit"><span class="material-icons">search</span>Aplicar</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2><span class="material-icons">fact_check</span> Registros <span id="contador" class="muted"></span></h2>
      <div class="tabela-scroll">
        <table>
          <thead>
            <tr>
              <th>Data / Hora</th>
              <th>Usuário</th>
              <th>Área</th>
              <th>Ação</th>
              <th>Registro</th>
              <th>O que foi feito</th>
              <th>Resultado</th>
            </tr>
          </thead>
          <tbody id="corpoTabela">
            <tr><td colspan="7" class="empty">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="paginacao">
        <span class="muted" id="infoPagina"></span>
        <span style="display:flex;gap:8px">
          <button class="btn btn-sm" type="button" id="btnAnterior" onclick="mudarPagina(-1)"><span class="material-icons">chevron_left</span>Anterior</button>
          <button class="btn btn-sm" type="button" id="btnProxima" onclick="mudarPagina(1)">Próxima<span class="material-icons">chevron_right</span></button>
        </span>
      </div>
    </div>
  </div>

  <script src="/scripts/api-config.js"></script>
  <script>
    const API_URL = window.APP_CONFIG?.API_URL || '/api';

    // Rótulos legíveis para as ações gravadas pelo backend.
    const ACAO_LABEL = {
      login: 'Login',
      login_falha: 'Login recusado',
      usuario_criar: 'Criou usuário',
      usuario_atualizar: 'Alterou usuário',
      checklist_criar: 'Criou checklist',
      checklist_atualizar: 'Editou checklist',
      checklist_mudar_status: 'Mudou status',
      checklist_excluir: 'Excluiu checklist',
      checklist_editar_negado: 'Edição bloqueada',
      checklist_concluir_negado: 'Conclusão bloqueada',
      checklist_transicao_negada: 'Transição bloqueada',
      checklist_excluir_negado: 'Exclusão bloqueada',
      dashboard_modulos_atualizar: 'Alterou módulos',
      dashboard_modulos_negado: 'Alteração bloqueada'
    };
    const CATEGORIA_LABEL = {
      checklist: 'Checklist',
      usuario: 'Usuários',
      autenticacao: 'Acesso',
      dashboard: 'Dashboard',
      geral: 'Geral'
    };
    const ROLE_LABEL = {
      admin: 'Administrador',
      qualidade: 'Qualidade',
      aprovador_qualidade: 'Aprovação Qualidade',
      engenharia: 'Engenharia',
      logistica_pc: 'Log. / P.C.',
      producao_aprovacao: 'Produção',
      operador: 'Operador'
    };

    let paginaAtual = 1;
    let totalPaginas = 1;
    let opcoesCarregadas = false;

    const getUser = () => { try { return JSON.parse(localStorage.getItem('currentUser') || '{}') } catch { return {} } };
    const getToken = () => { const t = localStorage.getItem('authToken'); return t && t !== 'null' && t !== 'undefined' ? t : null };
    const isAdmin = () => getUser().role === 'admin' && !!getToken();
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    function toast(msg, tipo = '') {
      const old = document.querySelector('.toast'); if (old) old.remove();
      const el = document.createElement('div');
      el.className = 'toast ' + tipo;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function logout() {
      if (!confirm('Deseja realmente sair do sistema?')) return;
      localStorage.removeItem('currentUser');
      localStorage.removeItem('authToken');
      location.href = '/login.html';
    }

    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` };
    }

    function formatarData(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return { data: String(iso || ''), hora: '' };
      const pad = (n) => String(n).padStart(2, '0');
      return {
        data: `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`,
        hora: `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`
      };
    }

    function filtrosAtuais() {
      return {
        usuario: document.getElementById('fUsuario').value,
        categoria: document.getElementById('fCategoria').value,
        acao: document.getElementById('fAcao').value,
        resultado: document.getElementById('fResultado').value,
        data_inicio: document.getElementById('fDataInicio').value,
        data_fim: document.getElementById('fDataFim').value,
        busca: document.getElementById('fBusca').value.trim()
      };
    }

    function montarQuery(extras = {}) {
      const params = new URLSearchParams();
      const filtros = { ...filtrosAtuais(), ...extras };
      Object.entries(filtros).forEach(([k, v]) => { if (v) params.set(k, v); });
      return params.toString();
    }

    async function buscarLogs(pagina, limite) {
      const query = montarQuery({ page: pagina, limit: limite });
      const r = await fetch(`${API_URL}/admin/audit-logs?${query}`, { headers: authHeaders() });
      const data = await r.json();
      if (!r.ok || !data.success) throw new Error(data.message || 'Falha ao carregar os logs');
      return data;
    }

    function preencherOpcoes(opcoes) {
      if (opcoesCarregadas || !opcoes) return;
      const preencher = (id, valores, rotulos) => {
        const sel = document.getElementById(id);
        const atual = sel.value;
        const primeira = sel.options[0].outerHTML;
        sel.innerHTML = primeira + valores
          .map((v) => `<option value="${esc(v)}">${esc((rotulos && rotulos[v]) || v)}</option>`)
          .join('');
        sel.value = atual;
      };
      preencher('fUsuario', opcoes.usuarios || []);
      preencher('fCategoria', opcoes.categorias || [], CATEGORIA_LABEL);
      preencher('fAcao', opcoes.acoes || [], ACAO_LABEL);
      opcoesCarregadas = true;
    }

    function linhaDetalhes(log, indice) {
      const alteracoes = Array.isArray(log.alteracoes) ? log.alteracoes : [];
      const tabelaDiff = alteracoes.length
        ? `<table class="diff">
             <thead><tr><th>Campo</th><th>Valor anterior</th><th>Novo valor</th></tr></thead>
             <tbody>${alteracoes.map((a) => `
               <tr>
                 <td class="mono">${esc(a.campo)}</td>
                 <td class="de mono">${a.de === null || a.de === undefined ? '—' : esc(a.de)}</td>
                 <td class="para mono">${a.para === null || a.para === undefined ? '—' : esc(a.para)}</td>
               </tr>`).join('')}
             </tbody>
           </table>`
        : '<div class="muted" style="padding-top:10px">Nenhuma alteração de campo registrada neste evento.</div>';

      return `
        <tr class="detalhes" id="det-${indice}" hidden>
          <td colspan="7">
            ${tabelaDiff}
            <div class="meta-linha">
              <span><strong>IP:</strong> ${esc(log.ip || '—')}</span>
              <span><strong>Rota:</strong> <span class="mono">${esc(log.metodo || '')} ${esc(log.rota || '—')}</span></span>
              <span><strong>Navegador:</strong> ${esc(log.user_agent || '—')}</span>
            </div>
          </td>
        </tr>`;
    }

    function renderizar(data) {
      const corpo = document.getElementById('corpoTabela');
      const logs = data.logs || [];

      if (!logs.length) {
        corpo.innerHTML = '<tr><td colspan="7" class="empty">Nenhum registro encontrado para os filtros aplicados.</td></tr>';
      } else {
        corpo.innerHTML = logs.map((log, i) => {
          const { data: dia, hora } = formatarData(log.timestamp);
          const categoria = log.categoria || 'geral';
          const resultado = log.resultado || 'sucesso';
          return `
            <tr class="linha-log" onclick="alternarDetalhes(${i})">
              <td class="quando">${esc(dia)}<small>${esc(hora)}</small></td>
              <td>
                <div class="usuario"><span class="material-icons">account_circle</span>${esc(log.usuario)}</div>
                <div class="muted">${esc(ROLE_LABEL[log.role] || log.role || '')}</div>
              </td>
              <td><span class="badge cat-${esc(categoria)}">${esc(CATEGORIA_LABEL[categoria] || categoria)}</span></td>
              <td>${esc(ACAO_LABEL[log.acao] || log.acao)}</td>
              <td class="mono">${esc(log.entidade_id || '—')}</td>
              <td>${esc(log.descricao)}</td>
              <td><span class="badge res-${esc(resultado)}">${esc(resultado)}</span></td>
            </tr>
            ${linhaDetalhes(log, i)}`;
        }).join('');
      }

      const p = data.paginacao || { pagina: 1, total: 0, total_paginas: 1 };
      paginaAtual = p.pagina;
      totalPaginas = p.total_paginas;
      document.getElementById('contador').textContent = `— ${p.total} evento(s)`;
      document.getElementById('infoPagina').textContent = `Página ${p.pagina} de ${p.total_paginas}`;
      document.getElementById('btnAnterior').disabled = p.pagina <= 1;
      document.getElementById('btnProxima').disabled = p.pagina >= p.total_paginas;
    }

    function alternarDetalhes(indice) {
      const el = document.getElementById(`det-${indice}`);
      if (el) el.hidden = !el.hidden;
    }

    async function carregar(pagina = 1) {
      const corpo = document.getElementById('corpoTabela');
      corpo.innerHTML = '<tr><td colspan="7" class="empty">Carregando…</td></tr>';
      try {
        const limite = document.getElementById('fLimite').value;
        const data = await buscarLogs(pagina, limite);
        preencherOpcoes(data.opcoes);
        renderizar(data);
      } catch (e) {
        corpo.innerHTML = `<tr><td colspan="7" class="empty">${esc(e.message)}</td></tr>`;
      }
    }

    function mudarPagina(delta) {
      const nova = paginaAtual + delta;
      if (nova < 1 || nova > totalPaginas) return;
      carregar(nova);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function limparFiltros() {
      document.getElementById('formFiltros').reset();
      carregar(1);
    }

    // Exporta os eventos que casam com os filtros atuais (até 5.000 registros).
    async function exportarCSV() {
      try {
        toast('Gerando CSV…');
        const linhas = [];
        for (let pagina = 1; pagina <= 25; pagina++) {
          const data = await buscarLogs(pagina, 200);
          linhas.push(...(data.logs || []));
          if (pagina >= (data.paginacao?.total_paginas || 1)) break;
        }

        if (!linhas.length) { toast('Nada para exportar.', 'err'); return; }

        const campo = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const cabecalho = ['Data/Hora', 'Usuario', 'Perfil', 'Area', 'Acao', 'Registro', 'Descricao', 'Resultado', 'Alteracoes', 'IP', 'Rota'];
        const csv = [cabecalho.map(campo).join(';')].concat(linhas.map((log) => {
          const { data: dia, hora } = formatarData(log.timestamp);
          const alteracoes = (log.alteracoes || [])
            .map((a) => `${a.campo}: ${a.de ?? '—'} -> ${a.para ?? '—'}`)
            .join(' | ');
          return [
            `${dia} ${hora}`,
            log.usuario,
            ROLE_LABEL[log.role] || log.role,
            CATEGORIA_LABEL[log.categoria] || log.categoria,
            ACAO_LABEL[log.acao] || log.acao,
            log.entidade_id,
            log.descricao,
            log.resultado,
            alteracoes,
            log.ip,
            `${log.metodo || ''} ${log.rota || ''}`
          ].map(campo).join(';');
        })).join('\r\n');

        // BOM para o Excel reconhecer os acentos
        const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `auditoria-4m-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        toast(`${linhas.length} evento(s) exportado(s).`, 'ok');
      } catch (e) {
        toast(e.message, 'err');
      }
    }

    document.getElementById('formFiltros').addEventListener('submit', (ev) => {
      ev.preventDefault();
      carregar(1);
    });
    document.getElementById('fLimite').addEventListener('change', () => carregar(1));

    // Guarda de acesso + boot
    (function init() {
      if (!isAdmin()) {
        location.href = getToken() ? '/4m.html' : '/login.html';
        return;
      }
