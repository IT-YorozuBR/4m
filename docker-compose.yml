services:
  mongodb:
    image: mongo:4.4
    container_name: 4m_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 4m_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 4m_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3020
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/4m_checklist?authSource=admin
    ports:
      - "3020:3020"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - 4m_network

networks:
  4m_network:
    driver: bridge

volumes:
  mongodb_data:
